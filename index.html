<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rozcestník</title>
<meta name="description" content="Rychlý rozcestník na oblíbené weby.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236384ff'/%3E%3Cpath d='M11 12h10M11 16h7M11 20h10' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7fb;
    --bg-glow-1: rgba(99, 132, 255, 0.18);
    --bg-glow-2: rgba(255, 138, 101, 0.14);
    --text: #11151c;
    --muted: #5f6b7c;
    --card: rgba(255, 255, 255, 0.72);
    --card-hover: #ffffff;
    --border: rgba(17, 21, 28, 0.09);
    --shadow: 0 1px 2px rgba(17, 21, 28, 0.05), 0 12px 32px rgba(17, 21, 28, 0.07);
    --shadow-hover: 0 2px 4px rgba(17, 21, 28, 0.06), 0 20px 48px rgba(17, 21, 28, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0d13;
      --bg-glow-1: rgba(99, 132, 255, 0.22);
      --bg-glow-2: rgba(255, 138, 101, 0.16);
      --text: #e9eef7;
      --muted: #93a0b3;
      --card: rgba(255, 255, 255, 0.045);
      --card-hover: rgba(255, 255, 255, 0.075);
      --border: rgba(255, 255, 255, 0.09);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 40px rgba(0, 0, 0, 0.35);
      --shadow-hover: 0 2px 6px rgba(0, 0, 0, 0.45), 0 24px 56px rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: clamp(24px, 6vw, 72px) clamp(18px, 5vw, 40px);
    background:
      radial-gradient(60% 55% at 12% 0%, var(--bg-glow-1), transparent 70%),
      radial-gradient(55% 50% at 88% 100%, var(--bg-glow-2), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 820px;
  }

  header { margin-bottom: clamp(28px, 5vw, 44px); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.18);
  }

  h1 {
    margin: 18px 0 8px;
    font-size: clamp(32px, 6vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.03em;
    font-weight: 700;
  }

  .lead {
    margin: 0;
    max-width: 42ch;
    color: var(--muted);
    font-size: clamp(15px, 2vw, 17px);
  }

  .links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
  }

  .link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--card);
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease, border-color 160ms ease;
  }

  .link:hover {
    transform: translateY(-2px);
    background: var(--card-hover);
    box-shadow: var(--shadow-hover);
    border-color: color-mix(in srgb, var(--brand) 45%, var(--border));
  }

  .link:active { transform: translateY(0); }

  .link:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 3px;
  }

  .icon {
    flex: none;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--brand) 14%, transparent);
    color: var(--brand);
  }

  .icon svg { width: 22px; height: 22px; display: block; }

  .label {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .name { font-weight: 600; font-size: 15.5px; }

  .host {
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .arrow {
    margin-left: auto;
    flex: none;
    color: var(--muted);
    opacity: 0.7;
    transition: transform 160ms ease, opacity 160ms ease, color 160ms ease;
  }

  .arrow svg { width: 18px; height: 18px; display: block; }

  .link:hover .arrow {
    transform: translateX(3px);
    opacity: 1;
    color: var(--brand);
  }

  .link-yt { --brand: #ff0033; }
  .link-google { --brand: #4285f4; }
  .link-seznam { --brand: #cc0000; }

  footer {
    margin-top: clamp(28px, 5vw, 44px);
    color: var(--muted);
    font-size: 13px;
  }

  footer code {
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
  }

  @media (prefers-reduced-motion: reduce) {
    .link, .arrow { transition: none; }
    .link:hover { transform: none; }
  }
</style>
</head>
<body>
  <main>
    <header>
      <span class="badge">LinkPage</span>
      <h1>Rozcestník</h1>
      <p class="lead">Rychlé odkazy na weby, které používáš každý den. Zatím jen zkušební tři.</p>
    </header>

    <ul class="links">
      <li>
        <a class="link link-yt" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
              <rect x="2.5" y="5.5" width="19" height="13" rx="4" />
              <path d="M10.2 9.4l5 2.6-5 2.6V9.4z" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <span class="label">
            <span class="name">YouTube</span>
            <span class="host">youtube.com</span>
          </span>
          <span class="arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7M9 7h8v8" />
            </svg>
          </span>
        </a>
      </li>

      <li>
        <a class="link link-google" href="https://www.google.com" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="M15.5 15.5L21 21" />
            </svg>
          </span>
          <span class="label">
            <span class="name">Google</span>
            <span class="host">google.com</span>
          </span>
          <span class="arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7M9 7h8v8" />
            </svg>
          </span>
        </a>
      </li>

      <li>
        <a class="link link-seznam" href="https://www.seznam.cz" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M5 6.5h9a3.5 3.5 0 010 7H8" />
              <path d="M5 17.5h10" />
              <path d="M5 13.5h3" />
            </svg>
          </span>
          <span class="label">
            <span class="name">Seznam.cz</span>
            <span class="host">seznam.cz</span>
          </span>
          <span class="arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7M9 7h8v8" />
            </svg>
          </span>
        </a>
      </li>
    </ul>

    <footer>
      Prototyp · další odkaz přidáš jako <code>&lt;li&gt;</code> v <code>index.html</code>
    </footer>
  </main>
</body>
</html>
